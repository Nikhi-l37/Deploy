server {
    listen 80;
    server_name 06e5c202.deploy.local;

    location / {
        # Wake-on-Demand: Ask FastAPI if the container is sleeping
        auth_request /wake;
        
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (important for real-time Node.js apps)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location = /wake {
        internal;
        proxy_pass http://127.0.0.1:8000/gateway/06e5c202-3850-4fba-896e-44c61fc10ee6;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}

